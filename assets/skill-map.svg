<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Kinetic skill map</title>
  <desc id="d">Nineteen skills grouped into five areas, all routed by the kinetic umbrella skill.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="20" fill="#0f0f12"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f5f5f5">The skill map</text>

  <!-- umbrella -->
  <rect x="440" y="78" width="320" height="56" rx="28" fill="url(#accent)"/>
  <text x="600" y="113" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0c">kinetic (umbrella)</text>
  <line x1="600" y1="134" x2="600" y2="162" stroke="#2a2a33" stroke-width="2"/>
  <line x1="120" y1="162" x2="1080" y2="162" stroke="#2a2a33" stroke-width="2"/>

  <!-- group 1: foundation -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="120" y1="162" x2="120" y2="186" stroke="#2a2a33" stroke-width="2"/>
    <text x="120" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#7c5cff">Foundation</text>
    <g font-size="14" fill="#c9c9d1" text-anchor="middle">
      <rect x="20" y="228" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="120" y="250">motion-core</text>
      <rect x="20" y="272" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="120" y="294">motion-layout</text>
      <rect x="20" y="316" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="120" y="338">motion-gestures</text>
      <rect x="20" y="360" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="120" y="382">motion-performance</text>
    </g>
  </g>

  <!-- group 2: scroll & story -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="360" y1="162" x2="360" y2="186" stroke="#2a2a33" stroke-width="2"/>
    <text x="360" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#2dd4bf">Scroll and Story</text>
    <g font-size="14" fill="#c9c9d1" text-anchor="middle">
      <rect x="260" y="228" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="360" y="250">motion-scroll</text>
      <rect x="260" y="272" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="360" y="294">motion-scroll-effects</text>
      <rect x="260" y="316" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="360" y="338">motion-storytelling</text>
    </g>
  </g>

  <!-- group 3: UI & interaction -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="600" y1="162" x2="600" y2="186" stroke="#2a2a33" stroke-width="2"/>
    <text x="600" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#f97316">UI and Interaction</text>
    <g font-size="14" fill="#c9c9d1" text-anchor="middle">
      <rect x="500" y="228" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="600" y="250">motion-hero</text>
      <rect x="500" y="272" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="600" y="294">motion-navigation</text>
      <rect x="500" y="316" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="600" y="338">motion-buttons</text>
      <rect x="500" y="360" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="600" y="382">motion-text</text>
      <rect x="500" y="404" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="600" y="426">motion-components</text>
    </g>
  </g>

  <!-- group 4: visual & special -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="840" y1="162" x2="840" y2="186" stroke="#2a2a33" stroke-width="2"/>
    <text x="840" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#ec4899">Visual and Special</text>
    <g font-size="14" fill="#c9c9d1" text-anchor="middle">
      <rect x="740" y="228" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="840" y="250">motion-svg</text>
      <rect x="740" y="272" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="840" y="294">motion-cursor</text>
      <rect x="740" y="316" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="840" y="338">motion-transitions</text>
    </g>
  </g>

  <!-- group 5: quality & reference -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="1080" y1="162" x2="1080" y2="186" stroke="#2a2a33" stroke-width="2"/>
    <text x="1080" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#22c55e">Quality and Reference</text>
    <g font-size="14" fill="#c9c9d1" text-anchor="middle">
      <rect x="980" y="228" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="1080" y="250">motion-accessibility</text>
      <rect x="980" y="272" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="1080" y="294">motion-dev-animations</text>
      <rect x="980" y="316" width="200" height="34" rx="8" fill="#18181d" stroke="#2a2a33"/><text x="1080" y="338">bold-web-animation</text>
    </g>
  </g>

  <text x="600" y="520" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8b8b93">motion-accessibility applies to every other skill. Its rules are never optional.</text>
</svg>
