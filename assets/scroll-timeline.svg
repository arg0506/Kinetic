<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Scrollytelling chapters</title>
  <desc id="d">Three chapters share one sticky stage. Each chapter fades in and out as scroll progress moves from 0 to 1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8b93"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#0f0f12"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5">Scrollytelling: one stage, three chapters</text>

  <!-- axes -->
  <line x1="90" y1="290" x2="1110" y2="290" stroke="#8b8b93" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="346" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b8b93">scroll progress 0 to 1</text>

  <!-- chapter bands -->
  <rect x="90" y="100" width="340" height="170" rx="10" fill="#7c5cff" fill-opacity="0.08"/>
  <rect x="430" y="100" width="340" height="170" rx="10" fill="#2dd4bf" fill-opacity="0.08"/>
  <rect x="770" y="100" width="340" height="170" rx="10" fill="#f97316" fill-opacity="0.08"/>

  <!-- opacity curves -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M90 130 L300 130 L390 260 L1110 260" stroke="#7c5cff"/>
    <path d="M90 260 L390 260 L430 130 L730 130 L770 260" stroke="#2dd4bf" transform="translate(0,0)"/>
    <path d="M90 260 L730 260 L770 130 L1110 130" stroke="#f97316"/>
  </g>

  <!-- chapter labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="260" y="88" fill="#7c5cff">Chapter 1</text>
    <text x="600" y="88" fill="#2dd4bf">Chapter 2</text>
    <text x="940" y="88" fill="#f97316">Chapter 3</text>
  </g>

  <!-- tick labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8b8b93" text-anchor="middle">
    <text x="90" y="312">0</text>
    <text x="430" y="312">1/3</text>
    <text x="770" y="312">2/3</text>
    <text x="1110" y="312">1</text>
  </g>
</svg>
