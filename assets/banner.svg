<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Kinetic</title>
  <desc id="d">Kinetic: production-grade motion skills for websites</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#16122e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>

  <!-- motion trails -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M700 250 C 820 120, 940 300, 1060 150 S 1150 90, 1170 110" stroke-width="3" opacity="0.9"/>
    <path d="M700 268 C 820 140, 940 318, 1060 170 S 1150 110, 1170 130" stroke-width="2" opacity="0.5"/>
    <path d="M700 286 C 820 160, 940 336, 1060 190 S 1150 130, 1170 150" stroke-width="1.5" opacity="0.25"/>
  </g>
  <circle cx="1060" cy="150" r="10" fill="#2dd4bf"/>
  <circle cx="1060" cy="150" r="22" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>

  <!-- title -->
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#f5f5f5" letter-spacing="-2">Kinetic</text>
  <rect x="72" y="162" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#c9c9d1">Production-grade motion skills for websites</text>
  <text x="70" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8b8b93">Hero · Scroll · Story · Navigation · Buttons · Accessibility</text>
</svg>
